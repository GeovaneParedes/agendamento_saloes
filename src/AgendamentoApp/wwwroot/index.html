<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento de Local</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Flatpickr CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/airbnb.css" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Estilo Isolado -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">
  
  <div class="w-full max-w-xl bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    
    <!-- Cabeçalho -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center">
      <div class="inline-flex items-center justify-center w-12 h-12 bg-white/10 rounded-full mb-3 backdrop-blur-sm">
        <i class="fa-solid fa-calendar-check text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">Agendamento de Local</h1>
      <p class="text-blue-100 text-sm mt-1">Selecione o salão, escolha uma data disponível e confirme sua reserva</p>
    </div>

    <!-- Formulário -->
    <form id="formAgendamento" class="p-6 space-y-5">
      
      <!-- 1. Seletor de Salão -->
      <div>
        <label for="selectSalao" class="block text-sm font-semibold text-slate-700 mb-1.5">
          <i class="fa-solid fa-building mr-1.5 text-blue-600"></i> Local / Salão
        </label>
        <select id="selectSalao" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white font-medium text-slate-800 transition outline-none" required>
          <option value="" disabled selected>Escolha o salão...</option>
          <option value="Salão Nova Lima">Salão Nova Lima (Segunda a Sexta)</option>
          <option value="Salão Marques Herval">Salão Marques Herval (Somente Segunda)</option>
        </select>
        <p id="salaoInfo" class="text-xs text-slate-500 mt-1.5 flex items-center gap-1 hidden">
          <i class="fa-solid fa-circle-info text-blue-500"></i>
          <span id="salaoInfoText"></span>
        </p>
      </div>

      <!-- 2. Calendário de Seleção de Data -->
      <div id="containerData" class="space-y-1.5 opacity-50 pointer-events-none transition-all duration-300">
        <label class="block text-sm font-semibold text-slate-700">
          <i class="fa-solid fa-calendar-days mr-1.5 text-blue-600"></i> Selecione a Data Disponível
        </label>
        
        <input type="text" id="inputData" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 bg-white text-slate-800 font-medium transition outline-none cursor-pointer" placeholder="Clique para escolher a data..." readonly required />
        
        <div class="flex items-center justify-between text-xs text-slate-500 px-1">
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Dias Livres
          </span>
          <span class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full bg-slate-300"></span> Indisponível / Ocupado
          </span>
        </div>
      </div>

      <!-- 3. Congregação e Categoria em Grid -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="inputCongregacao" class="block text-sm font-semibold text-slate-700 mb-1.5">
            <i class="fa-solid fa-users mr-1.5 text-blue-600"></i> Congregação
          </label>
          <input type="text" id="inputCongregacao" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 transition outline-none" placeholder="Ex: Nova Lima" required />
        </div>

        <div>
          <label for="selectCategoria" class="block text-sm font-semibold text-slate-700 mb-1.5">
            <i class="fa-solid fa-tag mr-1.5 text-blue-600"></i> Categoria
          </label>
          <select id="selectCategoria" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white font-medium text-slate-800 transition outline-none" required>
            <option value="" disabled selected>Selecione...</option>
          </select>
        </div>
      </div>

      <!-- 4. Dados do Solicitante -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-1 border-t border-slate-100">
        <div>
          <label for="inputNomeSolicitante" class="block text-sm font-semibold text-slate-700 mb-1.5">
            <i class="fa-solid fa-user mr-1.5 text-blue-600"></i> Seu Nome
          </label>
          <input type="text" id="inputNomeSolicitante" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 transition outline-none" placeholder="Ex: João da Silva" required />
        </div>

        <div>
          <label for="inputEmailSolicitante" class="block text-sm font-semibold text-slate-700 mb-1.5">
            <i class="fa-solid fa-envelope mr-1.5 text-blue-600"></i> Seu E-mail
          </label>
          <input type="email" id="inputEmailSolicitante" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-slate-800 transition outline-none" placeholder="Para receber a confirmação" required />
        </div>
      </div>

      <!-- Botão de Enviar -->
      <button type="submit" id="btnSubmit" class="w-full py-3.5 px-6 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition duration-200 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed mt-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Confirmar Agendamento</span>
      </button>

    </form>

    <!-- Modal / Alerta de Sucesso / Erro -->
    <div id="mensagemFeedback" class="hidden p-4 mx-6 mb-6 rounded-xl border flex items-center gap-3"></div>

  </div>

  <footer class="mt-6 text-xs text-slate-400 text-center">
    Sistema de Agendamento • Confirmações automáticas por e-mail
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
