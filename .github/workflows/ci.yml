name: CI / Build & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar Dependências
      run: dotnet restore SaaS.sln

    - name: Compilar Projeto (Release)
      run: dotnet build SaaS.sln --configuration Release --no-restore

    - name: Executar Testes Unitários e Integração
      run: dotnet test SaaS.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
